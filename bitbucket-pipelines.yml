# The step runs directly inside the prebuilt build-environment image (public, no
# credentials involved) instead of docker-building it per run: Bitbucket's sandboxed
# docker daemon forbids the privileged buildkit container modern `docker build` boots
# ("--privileged=true is not allowed"), and rebuilding the toolchain image every run
# wasted minutes anyway. Rebuild + push with tools/push-build-image.sh after changing
# the Dockerfile, then bump the tag here.
image: cubicattache/gnomecast-webos-build:20260716

clone:
  depth: full

pipelines:
  default:
    - step:
        name: Native webOS build and IPK
        # Give Rust LTO 8 GB on the self-hosted Docker runner.
        size: 2x
        runs-on:
          - "self.hosted"
          - "linux"
        script:
          - git config --global --add safe.directory '*'
          - git submodule update --init third_party/backend_ndl third_party/IronRDP
          - cargo fmt --manifest-path webrdp-min/Cargo.toml --check
          # Quoted: a plain YAML scalar ending in ':' parses as a mapping key.
          - "cargo test --manifest-path webrdp-min/Cargo.toml --features native --locked"
          - cargo test --manifest-path third_party/IronRDP/Cargo.toml -p ironrdp-dvc -p ironrdp-svc -p ironrdp-egfx -p ironrdp-capture-replay --locked --lib
          - apt-get update
          - apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base
          - cmake -S third_party/backend_ndl -B /tmp/lgnome-backend-gstreamer -DBACKEND_NDL_WITH_GSTREAMER=ON -DPKG_CONFIG_EXECUTABLE=/usr/bin/pkg-config
          - cmake --build /tmp/lgnome-backend-gstreamer -j4
          - ctest --test-dir /tmp/lgnome-backend-gstreamer --output-on-failure
          - ./tools/syntax-check-native.sh
          - cmake -S native -B /tmp/lgnome-native-build
          - cmake --build /tmp/lgnome-native-build
          - ctest --test-dir /tmp/lgnome-native-build --output-on-failure
          - ./tools/build-native-webos.sh
        artifacts:
          - dist/native-webos/**
